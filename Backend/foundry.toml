[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = false

# Allow vm.writeFile to write to deployments/
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Remappings — match your forge install paths
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"
polygon = "${POLYGON_RPC}"
anvil   = "http://127.0.0.1:8545"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }